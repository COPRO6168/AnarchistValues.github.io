<html lang="en">
  <head>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:400,700" rel="stylesheet" />
    <link href="assets/style.css" rel="stylesheet" type="text/css" />
    <title>AnarchistValues Quiz</title>
    <link rel="icon" type="x-icon" href="assets/icon.png" />
    <link rel="shortcut icon" type="x-icon" href="assets/icon.png" />
    <meta charset="utf-8" />
    <script defer src="data/questions.js"></script>
    <script defer src="assets/js/quiz.js"></script>
  </head>

  <body>
    <h1>AnarchistValues</h1>
    <hr />
    <h2 style="text-align: center" id="question-number">Loading...</h2>
    <p class="question" id="question-text"></p>
    <button class="button stronglyAgree" onclick="next_question(1.0)">Strongly Agree</button>
    <br />
    <button class="button agree" onclick="next_question(0.5)">Agree</button>
    <br />
    <button class="button neutral" onclick="next_question(0.0)">Neutral/Unsure</button>
    <br />
    <button class="button disagree" onclick="next_question(-0.5)">Disagree</button>
    <br />
    <button class="button stronglyDisagree" onclick="next_question(-1.0)">Strongly Disagree</button>
    <br />
    <button class="small_button" onclick="prev_question()" id="back_button">Back</button>
    <button class="small_button_off" id="back_button_off">Back</button><br />

  </body>
</html>
